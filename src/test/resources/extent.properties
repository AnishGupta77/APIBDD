# Enable Spark Reporter
extent.reporter.spark.start=true

# Report location
extent.reporter.spark.out=target/ExtentReport/ExtentReport.html

# Report name
extent.reporter.spark.config.reportName=API Automation Test Report

# Document title
extent.reporter.spark.config.documentTitle=API Automation Execution Report

# Theme
extent.reporter.spark.config.theme=dark

# Tester / Author
extent.reporter.spark.config.author=Anish

# System information
systeminfo.OS=Windows
systeminfo.Java=Java 21
systeminfo.Environment=QA
systeminfo.Project=Pet API Automation
systeminfo.Framework=Rest Assured + Cucumber
systeminfo.Tester=Anish
